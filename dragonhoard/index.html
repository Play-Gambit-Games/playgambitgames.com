		<!--
			initial-scale=1 pins the initial zoom: without it older iOS Safari re-zooms on
			orientation change and the canvas comes back the wrong size. viewport-fit=cover lets
			the page extend under the notch/home indicator and is what makes the env(safe-area-*)

		<script>
			// Explicit opt-in read by packages/pixi-svelte's preloadFont(). Dragonhoard self-hosts
			// proxima-nova (see src/styles/modalTheme.scss), so this tells the shared loader to
			// watch the local @font-face instead of fetching from Typekit. This must run before
			// preloadFont() is called (it is, since inline <head> scripts execute before the
			// SvelteKit app bundle mounts), and no other app sets this flag.
			window.__SELF_HOSTED_FONTS__ = true;

			// START THE HUD FACE FETCHING FROM THE FIRST PACKETS OF THE DOCUMENT.
			//
			// The bar's readouts are Pixi Text nodes, and Pixi bakes whatever `fillText` resolves
			// to into a texture that is never re-rendered. Montserrat is declared in
			// styles/modalTheme.scss with `font-display: block`, and a browser does not start
			// fetching a face until something asks for that family AND that weight -- naming the
			// weight matters, because a variable font is fetched once but not for a weight nobody
			// has asked about. 600 is the bar's label, 700 its value.
			//
			// game/themeFont.ts awaits these same two loads, but it cannot run until the app
			// bundle has downloaded, parsed and mounted. Asking here costs nothing, cannot fail
			// the boot (document.fonts.load resolves with an empty array for an unknown family,
			// and the whole thing is guarded), and moves the start of the fetch several seconds
			// earlier on a slow connection. The woff2 is inlined as a data URI by the build, so
			// this resolves off the stylesheet rather than over the network.
			try {
				if (document.fonts && document.fonts.load) {
					document.fonts.load('600 120px Montserrat');
					document.fonts.load('700 120px Montserrat');
				}
			} catch (e) {
				/* a browser without the CSS Font Loading API keeps the block-period behaviour */
			}
		</script>
		<!--
			Boot curtain, inlined into the document on purpose.

			LoadingCurtain.svelte's whole reason to exist is to paint on the first frame, and as a
			Svelte component it structurally cannot: nothing it renders exists until the app bundle
			has downloaded, parsed and mounted. On a 400kbps connection that measured at 9.6s of
			black screen. This markup and its CSS are the same design expressed in static HTML, so
			they paint from the first packets of the document, before a single byte of JS or of the
			game's assets.

			It carries NO copy and no progress bar. The cavern ground and the breathing teal glow
			are the whole of it: nothing here names the game, and nothing here claims to be
			reporting progress. The comments beside the markup below say why on both counts, and
			where the game's name and tagline actually reach the player.

			LoadingCurtain.svelte adopts this element on mount (progress, then dismissal) instead
			of rendering a second copy of it -- see that file.

			WHAT GATES THE FIRST PAINT, MEASURED, because removing the copy looked at first like it
			had cost half a second and it had not. Chromium will not paint while a render-blocking
			stylesheet is pending, and SvelteKit's head injection point below adds one after this
			<style>. That stylesheet is 43KB, so on a slow link it, and not this markup, is what
			decides when the curtain appears. At 800kbps with 120ms of latency, three runs each,
			against the same build with byte-identical asset URLs:

			  this document                     stylesheet in at 1147 to 1174ms, paint 1184 to 1256ms
			  the same plus the old copy         stylesheet in at 1157 to 1174ms, paint 1212 to 1236ms

			No document sizes are quoted on purpose. Every earlier version of this paragraph gave
			one, and every one of them went stale the next time somebody edited a comment in this
			file, which changes the byte count without changing a pixel. For the record in the
			only form that keeps: this branch's built document is LARGER than main's, because it
			carries more comment text than it removed copy, and first paint is unchanged anyway.

			Paint follows the stylesheet by 30 to 80ms either way and the two documents are
			indistinguishable, so the copy removal neither helped nor hurt. Note that a
			screenshot taken during the boot cannot settle this question in either direction:
			capturing one forces a composite, which rasterises this inline markup in about 140ms
			whether or not the browser has presented a frame to the player. Compare documents
			against the same build with byte-identical asset URLs, or the measurement is of
			bandwidth rather than of the curtain.

			(One trap, since it cost a build. Do NOT write SvelteKit's head placeholder literally
			in a comment in this file: the template substitutes the FIRST occurrence, so a mention
			of it up here silently eats the real one and the document ships with no stylesheet and
			no module preloads at all. check-boot-curtain.mjs catches that, which is how this
			paragraph came to be here.)
		-->
		<style>
			#boot-curtain {
				position: fixed;
				inset: 0;
				z-index: 998; /* below the platform loader (999), above the canvas */
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				/* palette.obsidianCavern -> obsidianDeep: the cave's own deep blue, never neutral black. */
				background: radial-gradient(ellipse at 50% 45%, #0b1b2a 0%, #050e16 55%, #030910 100%);
				opacity: 1;
				transition: opacity 320ms ease-out;
			}
			#boot-curtain.is-hidden {
				opacity: 0;
				pointer-events: none;
			}
			#boot-curtain .glow {
				position: absolute;
				width: 120vmin;
				height: 120vmin;
				border-radius: 50%;
				background: radial-gradient(circle, rgba(53, 214, 208, 0.13) 0%, rgba(53, 214, 208, 0) 62%);
				animation: boot-breathe 4.5s ease-in-out infinite;
			}
			@keyframes boot-breathe {
				0%, 100% { transform: scale(0.92); opacity: 0.65; }
				50% { transform: scale(1.06); opacity: 1; }
			}
			/*
				THE PROGRESS BAR IS NOT DRAWN, and this is the element that used to draw it.

				It was a 4px gold track across the middle of the screen with a fill that grew with
				`stateApp.loadingProgress`. It never grew. A MutationObserver on this element's
				aria-valuenow caught every write to that state over a whole boot, and there were four,
				carrying two distinct values:

				  t+1148ms   loadingProgress 0     fill rendered 0px
				  t+14869ms  loadingProgress 0     fill rendered 0px
				  t+42880ms  loadingProgress 100   fill rendered 0px
				  t+42893ms  loadingProgress 100   fill rendered 0px

				The curtain stops being the surface the player is looking at at t+14593ms, when the
				platform's card and the studio ident mount from the same +layout.svelte on the same tick,
				both above it. So the value never takes an intermediate step at all, and the one step it
				does take lands 28 seconds after this element was last visible. Sampled every 25ms at
				390x844 and 1440x900 and at 400kbps, 800kbps and unthrottled, the number of frames in
				which the curtain was the top surface AND the fill had any width was 0 out of six runs:
				a 267.70px track on the phone and 300.00px on the desktop, with a 0.00px fill in every
				frame anyone could see. A bar that is provably always at zero is not a dim bar, it is a
				gold line drawn on an empty screen, so it went.

				WHERE THE FIX WOULD GO, IF SOMEONE LATER WANTS A WORKING BAR: not here. The markup was
				never the problem. packages/pixi-svelte/src/lib/components/AssetsLoader.svelte drives
				`stateApp.loadingProgress`, and its `onProgress` counts an asset only when that asset
				reports a value of 1, and only once `preLoaded` is true. The preload phase, which is
				where the download time actually goes, therefore reports nothing at all, and the total
				arrives as a single jump at the end. That file is shared by six apps, and the studio
				ident's own bar reads the same state and sits at 0% for most of its run for exactly the
				same reason, which is visible in the sequence captures under
				docs/boot-first-screen-2026-09-12. Fix it there and both bars start working; nothing done
				to this rule can achieve that.

				What is left here is that same element with nothing visible about it, because deleting it
				outright would take something real with it. It is the game's only accessible loading
				indicator: GambitLoader.svelte is `aria-hidden` precisely BECAUSE this progressbar
				announces the loading state underneath it, and that file says so. So the role, the label
				and the value survive for a screen reader, LoadingCurtain.svelte keeps updating
				aria-valuenow, and nothing is painted. The clip-path idiom keeps it in the accessibility
				tree; `display: none` or `visibility: hidden` would take it out of that tree too.
			*/
			#boot-curtain .progress {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				border: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-curtain .glow { animation: none; }
			}
		</style>

	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div id="boot-curtain">
			<div class="glow"></div>
			<!--
				The curtain carries NO copy at all and draws nothing but its ground: no title, no
				tagline, no mark, and since the measurement recorded in the style block above, no
				progress bar either. The cavern gradient and its breathing glow are the whole picture.

				It used to paint the game's name and a mechanic line here. That put the game's name on
				screen before the Gambit Games studio ident and then again on the title card immediately
				after it, so the game introduced itself twice around the studio's card. The ident is now
				the first thing of OURS that a player sees, and the title card
				(components/LoadingScreen.svelte) is the game's single branding moment.

				Not the first thing a player sees, though, and nothing here should claim it is: the
				platform's own "Powered By" card plays at z-index 999 (components-shared's
				LoaderStakeEngine) between this curtain and the ident, measured at 14.6s to 34.7s of a
				boot throttled to 800kbps. That card appears on BOTH surfaces. It is not a
				casino-only thing that the demo escapes: the demo build on playgambitgames.com was
				measured under the same throttle and the card is the top surface there at 11.0s.

				That fact killed a design. The curtain was briefly repainted in the studio ident's
				own charcoal ground so the two would read as one screen; the work is kept on
				`wip/dh-boot-curtain-ident-ground`. It was abandoned because there is no
				curtain-to-ident seam to hide on either surface, the platform's card sits across
				it, so matching the ident gained nothing a player could perceive while costing the
				game's palette on its own first screen. If that idea comes back, this is the
				measurement to check first.

				Removing the copy also retires a jurisdiction problem rather than solving it. The
				platform's requirements bar a fixed list of words in a social casino, and the game learns
				which casino a session is in from two independent signals (the `social` launch parameter,
				and `jurisdiction.socialCasino` in the /wallet/authenticate response, see
				src/i18n/sweeps.ts). Neither can be known at first paint: the response is a network round
				trip, and the parameter is absent in exactly the case the second signal was added for. So
				this element could never resolve its own wording by construction, and substituting the
				wording once the response landed would be too late, because a restricted word would
				already have been on screen for a frame. The line that used to sit here was worded to be
				correct in BOTH casinos for that reason. With no copy at all there is no wording left to
				resolve. That is a stronger property than a carefully chosen line, not a weaker one.

				The branded tagline is not lost. It still reaches the player a moment later on the title
				card, which renders inside <Authenticate> and therefore knows the jurisdiction for real,
				through `identity.tagline`.

				No restricted term is written anywhere in this file, comments included, so the built
				document is clean to a plain grep and not only to a parser.
				scripts/check-boot-curtain.mjs fails the build if this element disappears, if any text
				copy reappears inside it, or if a restricted term reaches its markup.
			-->
			<div
				class="progress"
				role="progressbar"
				aria-valuenow="0"
				aria-valuemin="0"
				aria-valuemax="100"
				aria-label="Loading"
			></div>
		</div>

						app.start(element)
					});
				}
			</script>
		</div>
