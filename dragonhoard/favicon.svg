<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dragonhoard">
	<!--
		Dragonhoard tab mark: the Dragon Eye, which is the game's wild symbol
		(static/assets/sprites/symbols/WD.webp) reduced to the one shape that survives 16px.
		The crystal facets and the stone plinth the symbol sits on are deliberately dropped:
		at favicon size they turn to noise and the silhouette stops reading as an eye.
		Palette is taken from src/game/theme.ts, not picked by eye.
	-->
	<defs>
		<radialGradient id="iris" cx="42%" cy="38%" r="62%">
			<stop offset="0%" stop-color="#d9bcff"/>
			<stop offset="42%" stop-color="#9b6fd4"/>
			<stop offset="100%" stop-color="#4a2b7a"/>
		</radialGradient>
		<radialGradient id="ground" cx="50%" cy="42%" r="60%">
			<stop offset="0%" stop-color="#0c161b"/>
			<stop offset="100%" stop-color="#030910"/>
		</radialGradient>
	</defs>

	<circle cx="16" cy="16" r="15.3" fill="url(#ground)"/>
	<circle cx="16" cy="16" r="15.35" fill="none" stroke="#35d6d0" stroke-opacity="0.7" stroke-width="1.3"/>

	<!--
		Iris at r=12.4, not the ~10 that looked right on a 128px preview. At 16px a smaller iris
		leaves the mark reading as a dark disc with a speck in it: the coloured area has to carry
		most of the circle for the eye to survive. Same reason the pupil below is wider than a
		literal dragon slit, which disappears under 24px.
	-->
	<circle cx="16" cy="16" r="12.4" fill="url(#iris)"/>

	<!-- vertical slit pupil: two arcs meeting at points, the one feature that must stay legible -->
	<path d="M16 4.6 C19.6 9.6 19.6 22.4 16 27.4 C12.4 22.4 12.4 9.6 16 4.6 Z" fill="#0a0410"/>

	<!-- warm glint, upper left, so the iris does not read flat -->
	<ellipse cx="10.9" cy="10.6" rx="2.7" ry="1.8" fill="#ffb46b" fill-opacity="0.55" transform="rotate(-34 10.9 10.6)"/>
</svg>
